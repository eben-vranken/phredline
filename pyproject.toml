[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phredline"
version = "1.0.0"
description = "A memory-bounded streaming FASTQ quality control and filtering engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Eben Vranken" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "hypothesis",
    "pytest-cov",
]

[project.scripts]
phredline = "phredline.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true